; =====================================================================
;  HỆ THỐNG TƯỚI CÂY THÔNG MINH IoT — PROJECT PLATFORMIO
;  - Mở thư mục này bằng VS Code + PlatformIO → bấm Build / Upload
;  - Cấu hình WiFi, server, chân cảm biến: include/app_config.h
;  - Chân màn hình TFT ILI9341: phần build_flags bên dưới
; =====================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
; Phân vùng 3 MB cho chương trình (TLS + web + font màn hình khá nặng; không dùng OTA)
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.0
; Tìm include lồng nhau giữa các thư viện trong lib/
lib_ldf_mode = deep+

build_flags =
    ; Cho mọi thư viện trong lib/ thấy được include/app_config.h, app_types.h
    -Iinclude

    ; ----- Cấu hình TFT_eSPI (thay cho việc sửa User_Setup.h trong thư viện) -----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    ; Nếu màu bị đảo (nền trắng thành đen) thì bật dòng dưới:
    ; -DTFT_INVERSION_ON=1
    ; Nếu đỏ và xanh dương bị đổi chỗ thì bật dòng dưới:
    ; -DTFT_RGB_ORDER=TFT_BGR
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ; Tắt cảnh báo "TOUCH_CS pin not defined" (không dùng cảm ứng)
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

; ---------------------------------------------------------------------
;  Chạy unit test cho phần logic viết bằng C thuần ngay trên máy tính
;  (không cần ESP32):  pio test -e native
;  Windows cần cài trình biên dịch gcc (MinGW / MSYS2).
; ---------------------------------------------------------------------
[env:native]
platform = native
build_flags = -Iinclude -std=c11
lib_ignore = app_state, storage, sensors, pump, button, net, cloud, local_web, display, rtc_ds1302, timekeeper
test_build_src = no
